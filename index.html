<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE9DC">
<title>Stundenbuch</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --grund:#EFE9DC; --karte:#F8F5EE; --holz:#26201A;
  --linie:#D9CFBB; --grau:#847865;
  --zollstock:#E3A008; --gruen:#5C7F3F; --rot:#B23A2C;
  --schrift: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --rand:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--grund);color:var(--holz);font-family:var(--schrift);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
:focus-visible{outline:3px solid var(--zollstock);outline-offset:2px;}
.zahl{font-variant-numeric:tabular-nums;}
img{max-width:100%;}

.kopf{position:sticky;top:0;z-index:20;background:var(--grund);
  border-bottom:1px solid var(--linie);
  padding:calc(10px + env(safe-area-inset-top)) var(--rand) 10px;
  display:flex;align-items:baseline;gap:10px;}
.kopf h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;}
.kopf .wer{margin-left:auto;font-size:13px;color:var(--grau);}
.kopf .wer button{background:none;border:0;color:var(--grau);text-decoration:underline;
  padding:0;cursor:pointer;font-size:13px;}

main{padding:var(--rand) var(--rand) 24px;max-width:720px;margin:0 auto;}
h2{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em;}
h2.abstand{margin-top:28px;}
h2 .nebenzahl{float:right;color:var(--grau);font-weight:400;}
p.hinweis{font-size:13.5px;color:var(--grau);margin:0 0 14px;max-width:62ch;}

.karte{background:var(--karte);border:1px solid var(--linie);border-radius:6px;
  padding:14px;margin-bottom:12px;}

.feld{margin-bottom:14px;}
.feld label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px;}
.feld label.zeileninhalt{display:flex;align-items:center;gap:9px;font-weight:500;}
.feld input,.feld select,.feld textarea{width:100%;padding:11px 12px;background:var(--karte);
  border:1px solid var(--linie);border-radius:5px;}
.feld input[type=checkbox]{width:auto;}
.feld input:focus,.feld select:focus{border-color:var(--holz);}
.zeile{display:flex;gap:10px;}
.zeile>*{flex:1;min-width:0;}

.knopf{display:block;width:100%;padding:15px;background:var(--holz);color:var(--grund);
  border:0;border-radius:5px;font-weight:700;cursor:pointer;}
.knopf:disabled{opacity:.4;}
.knopf.zweit{background:none;color:var(--holz);border:1px solid var(--linie);font-weight:600;}
.knopf.gefahr{background:none;color:var(--rot);border:1px solid var(--rot);font-weight:600;}
.knopf+.knopf{margin-top:8px;}
.knopf.klein{width:auto;padding:8px 13px;font-size:14px;}

button.tat{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;
  background:var(--karte);border:1px solid var(--linie);border-left:5px solid var(--linie);
  border-radius:5px;cursor:pointer;}
button.tat[data-art="wert"]{border-left-color:var(--gruen);}
button.tat[data-art="noetig"]{border-left-color:var(--zollstock);}
button.tat[data-art="verlust"]{border-left-color:var(--rot);}
button.tat.aktiv{background:#EDE4CE;border-color:var(--holz);}
button.tat small{display:block;color:var(--grau);font-size:12.5px;}

/* ---- Tagesnavigation ---- */
.tagnav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.tagnav button{background:var(--karte);border:1px solid var(--linie);border-radius:5px;
  width:44px;height:44px;font-size:19px;cursor:pointer;flex:none;}
.tagnav .datum{flex:1;text-align:center;font-weight:700;font-size:16px;}
.tagnav .datum small{display:block;font-weight:400;font-size:12.5px;color:var(--grau);}

/* ---- Stufenregler ---- */
.stufen{display:flex;align-items:center;gap:10px;}
.stufen button{width:52px;height:52px;flex:none;background:var(--karte);
  border:1px solid var(--linie);border-radius:5px;font-size:24px;font-weight:700;cursor:pointer;}
.stufen input{flex:1;text-align:center;font-size:26px;font-weight:700;
  font-variant-numeric:tabular-nums;padding:10px 4px;background:var(--karte);
  border:1px solid var(--linie);border-radius:5px;-moz-appearance:textfield;}
.stufen input::-webkit-outer-spin-button,.stufen input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;}
.stufen .einheit{font-size:15px;color:var(--grau);flex:none;width:18px;}

/* ---- Tagesbilanz ---- */
.bilanz{border:1px solid var(--linie);border-radius:6px;background:var(--karte);
  padding:13px 14px;margin-bottom:14px;}
.bilanz .oben{display:flex;justify-content:space-between;font-size:14.5px;}
.bilanz .rest{margin-top:9px;padding-top:9px;border-top:1px solid var(--linie);
  display:flex;justify-content:space-between;font-weight:700;font-size:15px;}
.bilanz .rest[data-s="offen"]{color:#9A7005;}
.bilanz .rest[data-s="voll"]{color:var(--gruen);}
.bilanz .rest[data-s="zuviel"]{color:var(--rot);}

/* ---- Buchungszeilen ---- */
.zeilen{background:var(--karte);border:1px solid var(--linie);border-radius:6px;
  overflow:hidden;margin-bottom:14px;}
.buchung{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--linie);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;cursor:pointer;}
.buchung:last-child{border-bottom:0;}
.buchung:active{background:#F1ECE1;}
.buchung .strich{width:4px;align-self:stretch;border-radius:2px;background:var(--linie);flex:none;}
.buchung .strich[data-art="wert"]{background:var(--gruen);}
.buchung .strich[data-art="noetig"]{background:var(--zollstock);}
.buchung .strich[data-art="verlust"]{background:var(--rot);}
.buchung .mitte{flex:1;min-width:0;}
.buchung strong{font-size:15px;font-weight:700;display:block;}
.buchung small{color:var(--grau);font-size:12.5px;display:block;}
.buchung .h{font-weight:700;font-size:15.5px;white-space:nowrap;}
.reiter{display:flex;gap:8px;margin-bottom:4px;}
.reiter button{flex:1;padding:10px 6px;background:var(--karte);border:1px solid var(--linie);
  border-radius:5px;font-size:14px;font-weight:600;color:var(--grau);cursor:pointer;}
.reiter button.aktiv{background:var(--holz);color:var(--grund);border-color:var(--holz);}
.minilink{background:none;border:0;color:var(--rot);cursor:pointer;font-size:12.5px;
  padding:3px 0 0;text-decoration:underline;}
.marke{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 6px;
  border-radius:3px;background:#F6E3B8;color:#7A5800;margin-top:3px;}

/* ---- Zollstock-Skala ---- */
.skala{position:relative;height:34px;margin:10px 0 6px;background:#E7DFCE;
  border:1px solid var(--linie);border-radius:3px;overflow:hidden;}
.skala .fuellung{position:absolute;left:0;top:0;bottom:0;width:var(--ist,0%);background:var(--zollstock);}
.skala .fuellung.ueber{background:var(--rot);}
.skala .striche{position:absolute;inset:0;background-image:repeating-linear-gradient(
  to right, rgba(38,32,26,.42) 0 1px, transparent 1px var(--tick,10%));}
.skala .soll{position:absolute;top:-2px;bottom:-2px;left:var(--soll,100%);width:3px;
  margin-left:-1.5px;background:var(--holz);}
.skala .soll::after{content:"";position:absolute;top:0;left:-4px;
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:6px solid var(--holz);}
.skalatext{display:flex;justify-content:space-between;font-size:12.5px;color:var(--grau);}
.stand{font-size:13px;font-weight:700;}
.stand[data-s="gruen"]{color:var(--gruen);}
.stand[data-s="gelb"]{color:#9A7005;}
.stand[data-s="rot"]{color:var(--rot);}
.stand[data-s="grau"]{color:var(--grau);}

.auftragkopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.auftragkopf strong{font-size:15.5px;letter-spacing:-.01em;}
.auftragkopf .nr{font-size:12.5px;color:var(--grau);white-space:nowrap;}
.kunde{font-size:13.5px;color:var(--grau);margin:2px 0 0;}

.kundenkopf{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--grau);border-bottom:1px solid var(--linie);padding-bottom:5px;}
.kennzahl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--linie);font-size:14.5px;}
.kennzahl:last-child{border-bottom:0;}
.balken{height:9px;background:#E7DFCE;border-radius:2px;overflow:hidden;margin-top:5px;}
.balken i{display:block;height:100%;background:var(--holz);}
.balken i.wert{background:var(--gruen);}
.balken i.noetig{background:var(--zollstock);}
.balken i.verlust{background:var(--rot);}

.konto{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
  padding:12px 14px;background:var(--karte);border:1px solid var(--linie);border-radius:6px;font-size:14.5px;}
.konto b{font-size:19px;font-variant-numeric:tabular-nums;}
.konto b[data-s="plus"]{color:var(--gruen);}
.konto b[data-s="minus"]{color:var(--rot);}
.kontogross{text-align:center;font-size:40px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;padding:6px 0;}
.kontogross[data-s="plus"]{color:var(--gruen);}
.kontogross[data-s="minus"]{color:var(--rot);}
.uhr{background:var(--holz);color:var(--grund);border-radius:6px;padding:16px;margin-bottom:14px;}
.uhr .zeit{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.uhr small{display:block;opacity:.75;font-size:13px;margin-bottom:8px;}
.uhr button{margin-top:12px;width:100%;padding:12px;background:var(--zollstock);
  color:var(--holz);border:0;border-radius:5px;font-weight:700;cursor:pointer;}

nav{position:sticky;bottom:0;z-index:20;display:flex;background:var(--karte);
  border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom);}
nav button{flex:1;padding:11px 2px 10px;background:none;border:0;border-top:3px solid transparent;
  font-size:10.5px;font-weight:600;color:var(--grau);cursor:pointer;margin-top:-1px;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;}
nav button .punkt{display:inline-block;min-width:16px;height:16px;line-height:16px;
  border-radius:8px;background:var(--rot);color:#fff;font-size:10px;margin-left:3px;padding:0 4px;}
nav button.aktiv{color:var(--holz);border-top-color:var(--zollstock);}

.meldung{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:60;
  background:var(--holz);color:var(--grund);padding:11px 18px;border-radius:22px;
  font-size:14px;font-weight:600;max-width:88vw;text-align:center;}
.warnung{background:#F6E3B8;border:1px solid var(--zollstock);border-radius:5px;
  padding:10px 12px;font-size:13.5px;margin-bottom:12px;}
.leer{color:var(--grau);font-size:14px;padding:20px 0;text-align:center;}
.trenner{height:1px;background:var(--linie);margin:22px 0;}
.vorschau{margin-top:8px;border:1px solid var(--linie);border-radius:5px;max-height:180px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<header class="kopf">
  <h1>Stundenbuch</h1>
  <span class="wer" id="wer"></span>
</header>

<main id="inhalt"></main>

<nav id="nav" hidden>
  <button data-ansicht="tag">Tag</button>
  <button data-ansicht="woche">Woche</button>
  <button data-ansicht="auftraege">Aufträge</button>
  <button data-ansicht="lager">Bedarf</button>
  <button data-ansicht="auswertung" data-fuehrung="1">Zahlen</button>
  <button data-ansicht="verwaltung" data-fuehrung="1">Verwalten</button>
</nav>

<script>
"use strict";

/* =====================================================================
   1. Zustand
   ===================================================================== */
const S = {
  cfg:   laden("cfg", null),
  ich:   laden("ich", null),
  queue: laden("queue", []),
  uhr:   laden("uhr", null),
  pinMerk: laden("pinMerk", {}), // Prüfsummen für die Anmeldung ohne Netz
  letzte: laden("letzte", {}),   // zuletzt gewählter Auftrag und Tätigkeit
  cache: laden("cache", {}),
  ansicht: "tag",
  tag: heute(),
  form: null,     // offenes Erfassungsformular
  vform: null,    // Formular für einen vorläufigen Auftrag
  lagerFoto: null,
  wform: null,
  aform: null,    // offenes Auftragsformular
  auftraege: [], taetigkeiten: [], mitarbeiter: [], zeiten: [], anwesenheit: [], lager: [], wuensche: [], positionen: [],
  reiter: "lager",
  einst: {rueckmeldung:"0"},
  online: navigator.onLine
};

function laden(k,f){ try{const v=localStorage.getItem("sb_"+k); return v===null?f:JSON.parse(v);}catch(e){return f;} }
function sichern(k,v){ try{localStorage.setItem("sb_"+k, JSON.stringify(v));}catch(e){} }

/* =====================================================================
   2. Hilfen
   ===================================================================== */
const el = (id) => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function zahl(n,k){ const v=Number(n)||0; return v.toFixed(k===undefined?2:k).replace(".",","); }
function isoVon(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function heute(){ return isoVon(new Date()); }
function verschieben(iso,tage){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+tage); return isoVon(d); }
function vorTagen(n){ return verschieben(heute(),-n); }
function datumKurz(iso){ const t=String(iso).split("-"); return t[2]+"."+t[1]+"."; }
function datumLang(iso){ const t=String(iso).split("-"); return t[2]+"."+t[1]+"."+t[0]; }
function wochentag(iso){ return ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"][new Date(iso+"T12:00:00").getDay()]; }
function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }

// Prüfsumme der PIN, damit die Anmeldung auch ohne Netz funktioniert,
// ohne dass die PIN selbst auf dem Gerät liegt.
async function pruefsumme(id, pin){
  try{
    if(!(window.crypto && window.crypto.subtle)) return null;
    const roh = new TextEncoder().encode(id+":"+pin);
    const buf = await window.crypto.subtle.digest("SHA-256", roh);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return null; }
}
function komma(v){ return Number(String(v==null?"":v).replace(",", ".")); }
function viertel(v){ return Math.round(Number(v)*4)/4; }

let meldTimer=null;
function melden(text){
  const alt=document.querySelector(".meldung"); if(alt) alt.remove();
  const d=document.createElement("div");
  d.className="meldung"; d.setAttribute("role","status"); d.textContent=text;
  document.body.appendChild(d);
  clearTimeout(meldTimer); meldTimer=setTimeout(()=>d.remove(),2800);
}

// Klasse einer Tätigkeit: wert (am Werkstück) / noetig (nötig, berechenbar) / verlust
function tatArt(t){
  if(!t) return "";
  if(t.wertschoepfend) return "wert";
  return t.verrechenbar ? "noetig" : "verlust";
}
function tatBeschreibung(t){
  if(t.wertschoepfend) return "am Werkstück";
  return t.verrechenbar ? "notwendig, wird berechnet" : "Zeitverlust – bitte trotzdem buchen";
}

/* =====================================================================
   3. Datenbank
   ===================================================================== */
// Entfernt Schrägstriche und ein versehentlich mitkopiertes /rest/v1 am Ende
function basisUrl(url){
  return String(url||"").trim().replace(/\/+$/,"").replace(/\/rest(\/v1)?$/,"");
}

async function sb(pfad, opt){
  if(!S.cfg) throw new Error("Keine Verbindung eingerichtet");
  opt = opt || {};
  const kopf = {"apikey":S.cfg.key, "Authorization":"Bearer "+S.cfg.key, "Content-Type":"application/json"};
  if(opt.prefer) kopf["Prefer"] = opt.prefer;
  const r = await fetch(basisUrl(S.cfg.url)+"/rest/v1/"+pfad, {
    method: opt.method||"GET", headers: kopf,
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  if(!r.ok){
    let t=""; try{ t=await r.text(); }catch(e){}
    throw new Error("Datenbank meldet "+r.status+(t? ": "+t.slice(0,200):""));
  }
  if(r.status===204) return null;
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

async function datenHolen(){
  try{
    const [a,t,m,z,an,e,lg,wu,po] = await Promise.all([
      sb("auftraege?select=*&order=status.asc,nummer.desc"),
      sb("taetigkeiten?select=*&order=sortierung.asc"),
      sb("mitarbeiter?select=id,name,rolle,wochensoll,arbeitstage,startsaldo,aktiv&aktiv=is.true&order=name.asc"),
      sb("zeiten?select=id,client_id,auftrag_id,position_id,mitarbeiter_id,taetigkeit_id,datum,stunden,notiz,nachtrag&datum=gte."+vorTagen(365)+"&order=datum.desc&limit=6000"),
      sb("anwesenheit?select=*&order=datum.desc&limit=8000"),
      sb("einstellungen?select=*"),
      sb("lager?select=*&order=angelegt_am.desc&limit=500"),
      sb("wuensche?select=*&order=angelegt_am.desc&limit=300"),
      sb("positionen?select=*&order=sortierung.asc&limit=2000")
    ]);
    S.auftraege=a||[]; S.taetigkeiten=t||[]; S.mitarbeiter=m||[]; S.zeiten=z||[]; S.anwesenheit=an||[]; S.lager=lg||[]; S.wuensche=wu||[]; S.positionen=po||[];
    S.einst = {}; (e||[]).forEach(x => S.einst[x.schluessel] = x.wert);
    if(S.einst.rueckmeldung===undefined) S.einst.rueckmeldung="0";
    if(S.einst.stundensatz===undefined) S.einst.stundensatz="60";
    if(S.einst.kostensatz===undefined) S.einst.kostensatz="45";
    S.cache={auftraege:S.auftraege,taetigkeiten:S.taetigkeiten,mitarbeiter:S.mitarbeiter,
             zeiten:S.zeiten,anwesenheit:S.anwesenheit,einst:S.einst,lager:S.lager,wuensche:S.wuensche,positionen:S.positionen};
    sichern("cache",S.cache);
    S.online=true;
  }catch(err){
    S.online=false;
    const c=S.cache||{};
    S.auftraege=c.auftraege||[]; S.taetigkeiten=c.taetigkeiten||[]; S.mitarbeiter=c.mitarbeiter||[];
    S.zeiten=c.zeiten||[]; S.anwesenheit=c.anwesenheit||[]; S.einst=c.einst||{rueckmeldung:"0"}; S.lager=c.lager||[]; S.wuensche=c.wuensche||[]; S.positionen=c.positionen||[];
    if(S.cfg && S.ich) melden("Offline – letzter bekannter Stand");
  }
}

/* ---------- Warteschlange ---------- */
async function queueSenden(){
  if(!S.queue.length || !S.cfg) return;
  const rest=[];
  for(const p of S.queue){
    try{ await sb(p.pfad, {method:"POST", body:p.body, prefer:p.prefer}); }
    catch(e){ rest.push(p); }
  }
  const weg = S.queue.length - rest.length;
  S.queue=rest; sichern("queue",S.queue);
  if(weg>0) melden(weg+" Eintrag/Einträge übertragen");
}
async function senden(pfad, body, prefer, typ){
  const p = {pfad, body, prefer, typ};
  try{ await sb(pfad, {method:"POST", body, prefer}); return true; }
  catch(e){ S.queue.push(p); sichern("queue",S.queue); return false; }
}

/* =====================================================================
   4. Berechnung
   ===================================================================== */
function alleZeiten(){
  return S.zeiten.concat(
    S.queue.filter(q=>q.typ==="zeit").map(q=>Object.assign({},q.body,{id:q.body.client_id,_wartet:true}))
  );
}
function zeitenVon(mid, datum){ return alleZeiten().filter(z=>z.mitarbeiter_id===mid && z.datum===datum); }
function istStunden(aid){ return alleZeiten().reduce((s,z)=> z.auftrag_id===aid ? s+Number(z.stunden||0) : s, 0); }
function meineStunden(aid){ return alleZeiten().reduce((s,z)=> (z.auftrag_id===aid && z.mitarbeiter_id===S.ich.id) ? s+Number(z.stunden||0) : s, 0); }
function anwesend(mid, datum){
  const w = S.queue.filter(q=>q.typ==="anw" && q.body.mitarbeiter_id===mid && q.body.datum===datum).pop();
  if(w) return Number(w.body.stunden);
  const r = S.anwesenheit.find(x=>x.mitarbeiter_id===mid && x.datum===datum);
  return r ? Number(r.stunden) : null;
}
function summe(liste){ return liste.reduce((s,z)=>s+Number(z.stunden||0),0); }

// Stundenkonto: für jeden Tag, an dem eine Anwesenheit eingetragen ist,
// die Differenz zum Tagessoll. Tage ohne Eintrag (Urlaub, krank, Wochenende)
// zählen weder plus noch minus.
function anwesenheitsTage(mid){
  const aus = {};
  S.anwesenheit.filter(a=>a.mitarbeiter_id===mid).forEach(a=>{ aus[a.datum]=Number(a.stunden); });
  S.queue.filter(q=>q.typ==="anw" && q.body.mitarbeiter_id===mid)
         .forEach(q=>{ aus[q.body.datum]=Number(q.body.stunden); });
  return aus;
}
function tagessollVon(m){
  const w = Number(m && m.wochensoll)||0, d = Number(m && m.arbeitstage)||0;
  return d>0 ? w/d : 0;
}
function stundenkonto(mid, bis){
  const m = person(mid); if(!m) return {saldo:0, tage:0, soll:0, ist:0};
  const soll = tagessollVon(m);
  const tage = anwesenheitsTage(mid);
  let ist=0, n=0;
  Object.keys(tage).forEach(d=>{ if(bis && d>bis) return; ist+=tage[d]; n++; });
  return {saldo: Number(m.startsaldo||0) + ist - n*soll, tage:n, soll:n*soll, ist:ist};
}
function saldoMonat(mid, monat){   // monat = "2026-09"
  const m = person(mid); if(!m) return null;
  const soll = tagessollVon(m);
  const tage = anwesenheitsTage(mid);
  let ist=0, n=0;
  Object.keys(tage).forEach(d=>{ if(String(d).slice(0,7)!==monat) return; ist+=tage[d]; n++; });
  return n ? {saldo: ist-n*soll, tage:n, ist:ist} : null;
}
function vorzeichen(v){ return (v>0?"+":"")+zahl(v,2); }
function taet(id){ return S.taetigkeiten.find(t=>t.id===id); }
function aktiveTaet(){ return S.taetigkeiten.filter(t=>t.aktiv!==false); }
function auftrag(id){ return S.auftraege.find(a=>a.id===id); }
function posten(aid){ return S.positionen.filter(p=>p.auftrag_id===aid); }
function pos(id){ return S.positionen.find(p=>p.id===id); }
function istStundenPos(pid){ return alleZeiten().reduce((s,z)=> z.position_id===pid ? s+Number(z.stunden||0) : s, 0); }
// Soll eines Auftrags: Summe der Posten, sonst der Wert am Auftrag selbst
function sollVon(a){
  const ps = posten(a.id);
  if(ps.length) return ps.reduce((s,p)=>s+Number(p.kalkulierte_stunden||0),0);
  return Number(a.kalkulierte_stunden)||0;
}
function satzVerkauf(){ return Number(S.einst.stundensatz)||0; }
function satzKosten(){ return Number(S.einst.kostensatz)||satzVerkauf(); }

// Ergebnis einer Position: Angebot abzüglich Material und Lohnkosten
function ergebnisPos(x){
  const angebot  = x.angebotssumme!=null ? Number(x.angebotssumme) : null;
  const material = Number(x.materialkosten||0);
  const stdIst   = istStundenPos(x.id);
  const stdSoll  = Number(x.kalkulierte_stunden)||0;
  const lohn     = stdIst*satzKosten();
  return {angebot, material, stdIst, stdSoll, lohn,
          kosten: angebot!==null ? material+lohn : null,
          ergebnis: angebot!==null ? angebot-material-lohn : null,
          stdAbw: stdIst-stdSoll};
}
// Summen über einen Auftrag: Positionen, sonst der Auftrag selbst
function ergebnisAuftrag(a){
  const ps = posten(a.id);
  if(ps.length){
    let volumen=0, material=0, lohn=0, mitGeld=0;
    ps.forEach(x=>{
      const r = ergebnisPos(x);
      if(r.angebot!==null){ volumen+=r.angebot; mitGeld++; }
      material += Number(x.materialkosten||0);
      lohn     += r.lohn;
    });
    return {volumen: mitGeld? volumen : null, material, lohn,
            ergebnis: mitGeld? volumen-material-lohn : null, posten:ps};
  }
  const angebot = a.angebotssumme!=null ? Number(a.angebotssumme) : null;
  const material = Number(a.materialkosten||0);
  const lohn = istStunden(a.id)*satzKosten();
  return {volumen: angebot, material, lohn,
          ergebnis: angebot!==null ? angebot-material-lohn : null, posten:[]};
}
function euro(v){
  const n = Math.round(Number(v)||0);
  const vz = n<0 ? "-" : "";
  return vz + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " €";
}
function person(id){ return S.mitarbeiter.find(m=>m.id===id); }

function alleLager(){
  return S.queue.filter(q=>q.typ==="lager")
          .map(q=>Object.assign({},q.body,{id:q.body.client_id,_wartet:true}))
          .concat(S.lager);
}
function offeneMeldungen(){ return alleLager().filter(x=>x.status==="offen").length; }

/* Wochenwert einer Tätigkeitsgruppe aus den echten Buchungen der letzten 12 Wochen */
function wochenStundenFuer(ids){
  if(!ids || !ids.length) return 0;
  const seit = vorTagen(84);
  const st = alleZeiten().reduce((s,z)=> (z.datum>=seit && ids.indexOf(z.taetigkeit_id)>=0)
                ? s+Number(z.stunden||0) : s, 0);
  return st/12;
}
function wunschRechnung(w){
  const ids = String(w.taetigkeit_ids||"").split(",").filter(Boolean);
  const basis = wochenStundenFuer(ids);
  const proz  = Number(w.ersparnis)||0;
  const satz  = Number(S.einst.stundensatz)||0;
  const spart = basis*proz/100;
  const wert  = spart*satz;
  const kosten= Number(w.kosten)||0;
  return {ids, basis, spart, wert, kosten,
          wochen: (wert>0 && kosten>0) ? kosten/wert : null,
          jahr: wert*52};
}

function stand(ist, soll){
  soll=Number(soll)||0;
  if(soll<=0) return {s:"grau", text:"ohne Vorgabe"};
  const p=ist/soll;
  if(p>1)   return {s:"rot",  text:"über Maß"};
  if(p>=.8) return {s:"gelb", text:"knapp"};
  return {s:"gruen", text:"im Maß"};
}
function schrittWeite(max){
  const roh=max/12;
  for(const k of [0.5,1,2,5,10,20,25,50,100,200]) if(roh<=k) return k;
  return 500;
}
function skalaHtml(ist, soll){
  soll=Number(soll)||0;
  const max=Math.max(ist,soll,1)*1.12;
  const istP=Math.min(100,ist/max*100), sollP=Math.min(100,soll/max*100);
  const tick=Math.max(3, schrittWeite(max)/max*100);
  const st=stand(ist,soll);
  return '<div class="skala" style="--ist:'+istP.toFixed(1)+'%;--soll:'+sollP.toFixed(1)+'%;--tick:'+tick.toFixed(2)+'%">'
    + '<div class="fuellung'+(st.s==="rot"?" ueber":"")+'"></div><div class="striche"></div>'
    + (soll>0?'<div class="soll"></div>':'') + '</div>'
    + '<div class="skalatext"><span class="zahl">Soll '+zahl(soll,1)+' h · Ist '+zahl(ist,1)+' h</span>'
    + '<span class="stand" data-s="'+st.s+'">'+(soll>0?(ist>soll?"+":"")+zahl(ist-soll,1)+" h":"ohne Vorgabe")+'</span></div>';
}

function zeichnen(){
  const fuehrung = S.ich && S.ich.rolle==="fuehrung";

  el("wer").innerHTML = S.ich ? esc(S.ich.name)+' · <button id="abmelden">abmelden</button>' : "";
  Array.from(document.querySelectorAll("#nav button")).forEach(b=>{
    b.classList.toggle("aktiv", b.dataset.ansicht===S.ansicht);
    if(b.dataset.fuehrung) b.hidden = !fuehrung;
    if(b.dataset.ansicht==="lager"){
      const n = offeneMeldungen();
      b.innerHTML = "Bedarf" + (n? ' <span class="punkt">'+n+'</span>' : "");
    }
  });

  const c = el("inhalt");
  if(!S.cfg){ c.innerHTML=viewSetup(); nachher(); return; }
  if(!S.ich){ c.innerHTML=viewPerson(); nachher(); return; }

  const v = {tag:viewTag, woche:viewWoche, auftraege:viewAuftraege, lager:viewBedarf,
             auswertung:viewAuswertung, verwaltung:viewVerwaltung}[S.ansicht] || viewTag;
  const wartet = S.queue.length ? '<div class="warnung">'+S.queue.length+' Eintrag/Einträge warten auf Übertragung. Sie gehen nicht verloren.</div>' : "";
  c.innerHTML = wartet + v();
  nachher(); window.scrollTo(0,0);
}

  if(S.uhr) uhrTicken();
}

    + '</div>';

  if(S.uhr){
    const t=taet(S.uhr.taetigkeit_id), a=auftrag(S.uhr.auftrag_id);
    h += '<div class="uhr"><small>'+esc(t?t.name:"Zeitmessung")+(a?" · "+esc(a.nummer):"")+'</small>'
       + '<div class="zeit zahl" id="uhrzeit">00:00:00</div>'
       + '<button id="uhr_stopp">Messung beenden und buchen</button></div>';
  }

  // Anwesenheit
  h += '<div class="feld"><label for="anw">Wie lange warst du da?</label>'
     + '<div class="stufen">'
     + '<button data-anw="-0.25" aria-label="Viertelstunde weniger">−</button>'
     + '<input id="anw" type="text" inputmode="decimal" value="'+(anw!==null?zahl(anw,2):"")+'" placeholder="8,00">'
     + '<span class="einheit">h</span>'
     + '<button data-anw="0.25" aria-label="Viertelstunde mehr">+</button>'
     + '</div></div>';

  // Bilanz
  if(anw!==null || meine.length){
    const rest = anw!==null ? anw-zug : null;
    let zustand="offen", text="";
    if(rest===null){ text="Anwesenheit noch nicht eingetragen"; zustand="offen"; }
    else if(Math.abs(rest)<0.01){ text="vollständig"; zustand="voll"; }
    else if(rest>0){ text=zahl(rest,2)+" h noch nicht zugeordnet"; zustand="offen"; }
    else { text=zahl(-rest,2)+" h zuviel zugeordnet"; zustand="zuviel"; }
    h += '<div class="bilanz"><div class="oben"><span>Zugeordnet</span>'
       + '<span class="zahl">'+zahl(zug,2)+' h'+(anw!==null?' von '+zahl(anw,2)+' h':'')+'</span></div>'
       + '<div class="rest" data-s="'+zustand+'"><span>Stand</span><span class="zahl">'+esc(text)+'</span></div></div>';
  }

  // Zeilen
  if(meine.length){
    h += '<div class="zeilen">';
    meine.forEach(z=>{
      const t=taet(z.taetigkeit_id), a=auftrag(z.auftrag_id);

         + '<small>'+esc(a? (a.kunde||a.bezeichnung||a.nummer)+(z.position_id&&pos(z.position_id)? " · "+pos(z.position_id).bezeichnung : "") : "ohne Auftrag")
         + (z.notiz? " · "+esc(z.notiz):"")+(z._wartet?" · wartet auf Übertragung":"")+'</small>'
         + (z.nachtrag? '<span class="marke">Nachtrag prüfen</span>':'')
         + '</span><span class="h zahl">'+zahl(z.stunden,2)+' h</span></button>';
    });
    h += '</div>';
  }else{
    h += '<p class="leer">Für diesen Tag ist noch nichts erfasst.</p>';
  }

  const kto = stundenkonto(S.ich.id);
  h += '<button class="knopf" id="neue_zeit">Stunden eintragen</button>'

/* ---------- Woche ---------- */
function viewWoche(){
  const tage=[]; for(let i=0;i<7;i++) tage.push(verschieben(heute(),-i));
  const kto = stundenkonto(S.ich.id);
  const m = person(S.ich.id) || {wochensoll:38.5, arbeitstage:5};
  let h = '<h2>Dein Stundenkonto</h2>'
    + '<div class="karte"><div class="kontogross" data-s="'+(kto.saldo<-0.01?"minus":(kto.saldo>0.01?"plus":"null"))+'">'
    + vorzeichen(kto.saldo)+' h</div>'
    + '<p class="hinweis" style="margin:6px 0 0;text-align:center">aus '+kto.tage+' erfassten Tagen · '
    + zahl(m.wochensoll,2)+' h in der Woche</p></div>';

  const monate=[];
  for(let i=0;i<3;i++){
    const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    monate.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
  }
  const zeilen = monate.map(mo=>({mo, r:saldoMonat(S.ich.id, mo)})).filter(x=>x.r);
  if(zeilen.length){
    h += '<div class="karte">' + zeilen.map(x=>{
      const nm=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"][Number(x.mo.slice(5,7))-1];
      return '<div class="kennzahl"><span>'+nm+' ('+x.r.tage+' Tage)</span>'
        + '<b class="zahl stand" data-s="'+(x.r.saldo<-0.01?"rot":(x.r.saldo>0.01?"gruen":"grau"))+'">'+vorzeichen(x.r.saldo)+' h</b></div>';
    }).join("") + '</div>';
  }
  h += '<p class="hinweis">Gezählt werden nur Tage, an denen du eine Anwesenheit eingetragen hast. Urlaub, Krankheit und Wochenenden zählen weder plus noch minus.</p>';

  h+='<h2 class="abstand">Letzte sieben Tage</h2>';

  tage.forEach(d=>{
    const z = zeitenVon(S.ich.id,d), anw = anwesend(S.ich.id,d), zug = summe(z);
    if(!z.length && anw===null) return;
    const luecke = anw!==null && Math.abs(anw-zug)>=0.25;
    h += '<button class="buchung" data-gehezu="'+d+'" style="border:1px solid var(--linie);border-radius:6px;background:var(--karte);margin-bottom:8px">'
       + '<span class="strich" data-art="'+(luecke?"verlust":"wert")+'"></span>'
       + '<span class="mitte"><strong>'+wochentag(d)+', '+datumKurz(d)+'</strong>'
       + '<small>'+(anw!==null? zahl(anw,2)+" h anwesend" : "keine Anwesenheit eingetragen")
       + (luecke? " · "+zahl(anw-zug,2)+" h offen" : "")+'</small></span>'
       + '<span class="h zahl">'+zahl(zug,2)+' h</span></button>';
  });
  if(h.indexOf("data-gehezu")<0) h += '<p class="leer">In den letzten sieben Tagen ist nichts erfasst.</p>';
  return h;
}

/* ---------- Aufträge ---------- */
function viewAuftraege(){
  if(S.aform) return viewAuftragsformular();
  const fuehrung = S.ich.rolle==="fuehrung";
  return fuehrung ? auftraegeFuehrung() : auftraegeWerkstatt();
}

function auftraegeFuehrung(){
  const offen = S.auftraege.filter(a=>a.status!=="abgeschlossen");
  const zu    = S.auftraege.filter(a=>a.status==="abgeschlossen")
                 .sort((a,b)=>String(b.abgeschlossen_am||"").localeCompare(String(a.abgeschlossen_am||"")));
  let h="";

  const kritisch = offen.filter(a=>sollVon(a)>0 && istStunden(a.id)/sollVon(a)>=0.8);
  if(kritisch.length){
    h += '<div class="warnung"><strong>Achtung:</strong> '
      + kritisch.map(a=>esc((a.kunde||a.nummer))+" ("+zahl(istStunden(a.id)/sollVon(a)*100,0)+" %)").join(", ")
      + ' haben 80 % der kalkulierten Stunden erreicht.</div>';
  }

  const nach = S.auftraege.filter(a=>a.nachpflegen);
  if(nach.length){
    h += '<div class="warnung"><strong>Nachpflegen:</strong> '+nach.length
      + ' vorläufige(r) Auftrag/Aufträge warten auf Nummer, Stunden und Summe.</div>'
      + '<div class="zeilen" style="margin-bottom:18px">'
      + nach.map(a=>'<button class="buchung" data-auftrag-bearbeiten="'+esc(a.id)+'">'
        + '<span class="strich" data-art="verlust"></span>'
        + '<span class="mitte"><strong>'+esc(a.kunde||a.bezeichnung||"Vorläufiger Auftrag")+'</strong>'
        + '<small>'+esc(a.nummer)+' · vor Ort angelegt'+(posten(a.id).length? ' · '+posten(a.id).map(x=>x.bezeichnung).join(", ") : '')+'</small></span>'
        + '<span class="h zahl">'+zahl(istStunden(a.id),2)+' h</span></button>').join("")
      + '</div>';
  }

  h += '<h2>Offene Aufträge</h2>';
  if(!offen.length){ h += '<p class="leer">Keine offenen Aufträge.</p>'; }
  else{
    const kunden = [];
    offen.forEach(a=>{ const k=a.kunde||"ohne Kunde"; if(kunden.indexOf(k)<0) kunden.push(k); });
    kunden.forEach(k=>{
      const liste = offen.filter(a=>(a.kunde||"ohne Kunde")===k);
      h += '<h2 class="kundenkopf">'+esc(k)+'</h2>';
      liste.forEach(a=>{
        const ps = posten(a.id);
        h += '<div class="karte"><div class="auftragkopf"><strong>'+esc(a.bezeichnung||a.nummer)+'</strong>'
          + '<span class="nr">'+esc(a.nummer)+(a.art?" · "+esc(a.art):"")+'</span></div>'
          + skalaHtml(istStunden(a.id), sollVon(a));
        h += geldHtml(a);
        h += '<button class="knopf zweit klein" data-auftrag-bearbeiten="'+esc(a.id)+'" style="margin-top:10px">Bearbeiten, Posten, abschließen</button>'
          + '</div>';
      });
    });
  }

  if(zu.length){
    h += '<h2 class="abstand">Abgeschlossen</h2>'
      + zu.slice(0,20).map(a=>rueckmeldungHtml(a)).join("");
  }
  return h;
}

function auftraegeWerkstatt(){
  const meine = S.auftraege.filter(a=>a.status!=="abgeschlossen" && meineStunden(a.id)>0);
  const offen = S.auftraege.filter(a=>a.status!=="abgeschlossen" && meineStunden(a.id)===0);
  let h = '<h2>Woran du arbeitest</h2>';
  h += meine.length ? meine.map(a=>{
      const ps = posten(a.id);
      let k = '<div class="karte"><div class="auftragkopf"><strong>'+esc(a.kunde||a.bezeichnung||"Auftrag")+'</strong>'
        + '<span class="nr">'+esc(a.nummer)+'</span></div>'
        + (a.bezeichnung? '<p class="kunde">'+esc(a.bezeichnung)+(a.art?" · "+esc(a.art):"")+'</p>':"")
        + '<div class="kennzahl" style="border:0;padding:6px 0 0"><span>Deine Stunden</span>'
        + '<b class="zahl">'+zahl(meineStunden(a.id),2)+' h</b></div>';
      ps.forEach(x=>{
        const eigene = alleZeiten().reduce((sm,z)=> (z.position_id===x.id && z.mitarbeiter_id===S.ich.id) ? sm+Number(z.stunden||0) : sm, 0);
        if(eigene>0) k += '<div class="kennzahl" style="font-size:13.5px"><span>'+esc(x.bezeichnung)+'</span>'
          + '<b class="zahl">'+zahl(eigene,2)+' h</b></div>';
      });
      return k+'</div>';
    }).join("") : '<p class="leer">Du hast noch auf keinen Auftrag gebucht.</p>';

  if(offen.length){
    h += '<h2 class="abstand">Weitere offene Aufträge</h2><div class="karte">'
      + offen.map(a=>'<div class="kennzahl"><span>'+esc(a.kunde||a.bezeichnung||"")+' · '+esc(a.nummer)+'</span></div>').join("")
      + '</div>';
  }

  if(S.einst.rueckmeldung==="1"){
    const zu = S.auftraege.filter(a=>a.status==="abgeschlossen" && meineStunden(a.id)>0)
      .sort((a,b)=>String(b.abgeschlossen_am||"").localeCompare(String(a.abgeschlossen_am||"")));
    if(zu.length){
      h += '<h2 class="abstand">Was daraus geworden ist</h2>'
        + '<p class="hinweis">Rückblick auf abgeschlossene Aufträge, an denen du mitgearbeitet hast.</p>'
        + zu.slice(0,10).map(a=>rueckmeldungHtml(a)).join("");
    }
  }
  return h;
}

// Volumen, Ergebnis und Abweichung je Position
function geldHtml(a){
  const g = ergebnisAuftrag(a);
  const ps = g.posten;
  let h = '';
  if(ps.length){
    h += '<div style="margin-top:10px">';
    ps.forEach(x=>{
      const r = ergebnisPos(x);
      const st = stand(r.stdIst, r.stdSoll);
      h += '<div style="padding:8px 0;border-top:1px solid var(--linie)">'
        + '<div class="kennzahl" style="border:0;padding:0"><span><strong>'+esc(x.bezeichnung)+'</strong></span>'
        + '<b class="zahl stand" data-s="'+st.s+'">'+zahl(r.stdIst,1)+' von '+zahl(r.stdSoll,1)+' h</b></div>';
      if(r.angebot!==null){
        h += '<div class="kennzahl" style="border:0;padding:3px 0 0;font-size:13.5px;color:var(--grau)">'
          + '<span>Angebot '+euro(r.angebot)+' · Kosten '+euro(r.kosten)+'</span>'
          + '<b class="zahl stand" data-s="'+(r.ergebnis<0?"rot":(r.ergebnis>0?"gruen":"grau"))+'">'
          + (r.ergebnis>0?"+":"")+euro(r.ergebnis)+'</b></div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }
  if(g.volumen!==null){
    h += '<div class="bilanz" style="margin:12px 0 0">'
      + '<div class="oben"><span>Gesamtvolumen</span><span class="zahl">'+euro(g.volumen)+'</span></div>'
      + '<div class="oben" style="margin-top:5px;color:var(--grau);font-size:13.5px">'
      + '<span>Material '+euro(g.material)+' · Lohn '+euro(g.lohn)+'</span></div>'
      + '<div class="rest" data-s="'+(g.ergebnis<0?"zuviel":(g.ergebnis>0?"voll":"offen"))+'">'
      + '<span>Ergebnis</span><span class="zahl">'+(g.ergebnis>0?"+":"")+euro(g.ergebnis)+'</span></div></div>';
  }
  return h;
}

function rueckmeldungHtml(a){
  const ist = istStunden(a.id), soll = sollVon(a);
  const proTaet = {};
  alleZeiten().filter(z=>z.auftrag_id===a.id).forEach(z=>{
    const t=taet(z.taetigkeit_id), n=t?t.name:"ohne Zuordnung";
    proTaet[n] = proTaet[n] || {h:0, art: tatArt(t)};
    proTaet[n].h += Number(z.stunden||0);
  });
  let h = '<div class="karte"><div class="auftragkopf"><strong>'+esc(a.kunde||a.bezeichnung||"Auftrag")+'</strong>'
    + '<span class="nr">'+esc(a.nummer)+(a.abgeschlossen_am? " · "+datumKurz(a.abgeschlossen_am):"")+'</span></div>'
    + (a.bezeichnung && a.kunde? '<p class="kunde">'+esc(a.bezeichnung)+'</p>':'')
    + skalaHtml(ist, soll);
  const ps = posten(a.id);
  if(ps.length && S.ich.rolle!=="fuehrung"){
    ps.forEach(x=>{
      const pi=istStundenPos(x.id), psoll=Number(x.kalkulierte_stunden)||0, st=stand(pi,psoll);
      h += '<div class="kennzahl"><span>'+esc(x.bezeichnung)+'</span>'
        + '<b class="zahl stand" data-s="'+st.s+'">'+zahl(pi,1)+' von '+zahl(psoll,1)+' h</b></div>';
    });
  }
  Object.keys(proTaet).sort((x,y)=>proTaet[y].h-proTaet[x].h).forEach(n=>{
    const p=proTaet[n], anteil = ist? p.h/ist*100 : 0;
    h += '<div style="padding:7px 0"><div class="kennzahl" style="border:0;padding:0;font-size:13.5px">'
      + '<span>'+esc(n)+'</span><b class="zahl">'+zahl(p.h,1)+' h</b></div>'
      + '<div class="balken"><i class="'+p.art+'" style="width:'+anteil.toFixed(1)+'%"></i></div></div>';
  });
  if(S.ich.rolle==="fuehrung") h += geldHtml(a);
  if(a.abschluss_notiz) h += '<p class="hinweis" style="margin:10px 0 0">'+esc(a.abschluss_notiz)+'</p>';
  return h+'</div>';
}

          + '<div class="feld"><label for="ps_'+esc(x.id)+'_std">Stunden</label>'

function kalkulationshilfe(art){
  const fertig = S.auftraege.filter(a=>a.status==="abgeschlossen" && a.art===art && istStunden(a.id)>0);
  if(fertig.length<2) return '<p class="hinweis">Sobald zwei Aufträge der Art „'+esc(art)+'" abgeschlossen sind, stehen hier Erfahrungswerte.</p>';
  const istM = fertig.reduce((s,a)=>s+istStunden(a.id),0)/fertig.length;
  const mitSoll = fertig.filter(a=>Number(a.kalkulierte_stunden)>0);
  const abwM = mitSoll.length
    ? mitSoll.reduce((s,a)=>s+(istStunden(a.id)/Number(a.kalkulierte_stunden)-1),0)/mitSoll.length*100 : null;
  const proTaet={}; let ges=0;
  fertig.forEach(a=>alleZeiten().filter(z=>z.auftrag_id===a.id).forEach(z=>{
    const t=taet(z.taetigkeit_id), n=t?t.name:"ohne Zuordnung";
    proTaet[n]=(proTaet[n]||0)+Number(z.stunden||0); ges+=Number(z.stunden||0);
  }));
  const oben = Object.keys(proTaet).sort((x,y)=>proTaet[y]-proTaet[x]).slice(0,4);
  return '<div class="karte"><h2 style="margin-bottom:8px">Erfahrungswerte „'+esc(art)+'"</h2>'
    + '<p class="hinweis" style="margin-bottom:8px">Aus '+fertig.length+' abgeschlossenen Aufträgen.</p>'
    + '<div class="kennzahl"><span>Tatsächliche Stunden im Mittel</span><b class="zahl">'+zahl(istM,1)+' h</b></div>'
    + (abwM!==null? '<div class="kennzahl"><span>Mittlere Abweichung zur Kalkulation</span>'
        + '<b class="zahl stand" data-s="'+(abwM>10?"rot":(abwM>0?"gelb":"gruen"))+'">'+(abwM>0?"+":"")+zahl(abwM,0)+' %</b></div>' : "")
    + oben.map(n=>'<div class="kennzahl"><span>'+esc(n)+'</span><b class="zahl">'
        + zahl(ges?proTaet[n]/ges*100:0,0)+' %</b></div>').join("")
    + '</div>';
}

/* ---------- Bedarf: Lager und Wünsche ---------- */
function viewBedarf(){
  const n = offeneMeldungen();
  const h = '<div class="reiter">'
    + '<button data-reiter="lager"'+(S.reiter==="lager"?' class="aktiv"':'')+'>Fehlt jetzt'+(n?' ('+n+')':'')+'</button>'
    + '<button data-reiter="wunsch"'+(S.reiter==="wunsch"?' class="aktiv"':'')+'>Wünsche</button>'
    + '</div>';
  return h + (S.reiter==="wunsch" ? viewWuensche() : viewLager());
}

function viewLager(){
  const fuehrung = S.ich.rolle==="fuehrung";
  const alle = alleLager();
  const offen     = alle.filter(x=>x.status==="offen");
  const bestellt  = alle.filter(x=>x.status==="bestellt");
  const erledigt  = alle.filter(x=>x.status==="erledigt").slice(0,8);

  let h = '<h2 class="abstand">Was fehlt im Lager?</h2>'
    + '<div class="feld"><input id="l_text" type="text" placeholder="z. B. 5x80 Edelstahl" maxlength="200"></div>'
    + '<div class="feld"><input id="l_foto" type="file" accept="image/*" capture="environment">'
    + '<div id="l_vorschau">'+(S.lagerFoto?'<img class="vorschau" src="'+S.lagerFoto+'" alt="Foto">':'')+'</div></div>'
    + '<button class="knopf" id="l_speichern">Eintragen</button>';

  function zeile(x){
    const m = person(x.mitarbeiter_id);
    const wann = x.angelegt_am ? datumKurz(String(x.angelegt_am).slice(0,10)) : "";
    let knoepfe = "";
    if(fuehrung && x.status==="offen")    knoepfe = '<button class="knopf zweit klein" data-lager-status="bestellt" data-lager-id="'+esc(x.id)+'">bestellt</button>';
    if(fuehrung && x.status==="bestellt") knoepfe = '<button class="knopf zweit klein" data-lager-status="erledigt" data-lager-id="'+esc(x.id)+'">da</button>';
    const loeschbar = !x._wartet && (fuehrung || (x.mitarbeiter_id===S.ich.id && x.status==="offen"));
    return '<div class="buchung" style="cursor:default">'
      + '<span class="strich" data-art="'+(x.status==="offen"?"verlust":(x.status==="bestellt"?"noetig":"wert"))+'"></span>'
      + '<span class="mitte"><strong>'+esc(x.text)+'</strong>'
      + '<small>'+esc(m?m.name:"—")+(wann? " · "+wann:"")+(x._wartet? " · wartet auf Übertragung":"")+'</small>'
      + (x.foto? '<img class="vorschau" style="max-height:110px;margin-top:6px" src="'+x.foto+'" alt="Foto">':"")
      + (loeschbar? '<button class="minilink" data-lager-loeschen="'+esc(x.id)+'">löschen</button>':"")
      + '</span>'+knoepfe+'</div>';
  }

  h += '<h2 class="abstand">Offen'+(offen.length? ' <span class="nebenzahl">'+offen.length+'</span>':'')+'</h2>';
  h += offen.length ? '<div class="zeilen">'+offen.map(zeile).join("")+'</div>'
                    : '<p class="leer">Nichts offen. Gut so.</p>';

  if(bestellt.length){
    h += '<h2 class="abstand">Bestellt</h2><div class="zeilen">'+bestellt.map(zeile).join("")+'</div>';
  }
  if(erledigt.length){
    h += '<h2 class="abstand">Erledigt</h2><div class="zeilen">'+erledigt.map(zeile).join("")+'</div>';
  }
  if(!fuehrung) h += '<p class="hinweis">Sobald bestellt ist, wandert der Eintrag nach unten. Du siehst also, dass es angekommen ist.</p>';
  return h;
}

/* ---------- Wünsche und Anschaffungen ---------- */
function viewWuensche(){
  const fuehrung = S.ich.rolle==="fuehrung";
  const satz = Number(S.einst.stundensatz)||0;
  if(S.wform) return viewWunschFormular();

  let h = '<h2 class="abstand">Was würde die Arbeit leichter machen?</h2>'
    + '<p class="hinweis">Jeder Vorschlag wird an den echten Buchungen gemessen: Wie viel Zeit kosten die betroffenen Tätigkeiten heute, und was spart die Anschaffung davon ein?</p>'
    + '<button class="knopf" id="w_neu">Wunsch eintragen</button>';

  const reihen = [["idee","Vorschläge"],["beschlossen","Beschlossen"],["umgesetzt","Umgesetzt"],["abgelehnt","Zurückgestellt"]];
  let leer = true;
  reihen.forEach(function(paar){
    const st=paar[0], titel=paar[1];
    const liste = S.wuensche.filter(w=>w.status===st);
    if(!liste.length) return;
    leer = false;
    h += '<h2 class="abstand">'+titel+'</h2>';
    liste.forEach(w=>{
      const r = wunschRechnung(w);
      const m = person(w.mitarbeiter_id);
      h += '<div class="karte"><div class="auftragkopf"><strong>'+esc(w.titel)+'</strong>'
        + (r.kosten? '<span class="nr zahl">'+zahl(r.kosten,0)+' €</span>':'')+'</div>'
        + (w.begruendung? '<p class="kunde">'+esc(w.begruendung)+'</p>':'')
        + '<p class="kunde">'+esc(m?m.name:"—")+'</p>';
      if(r.ids.length){
        h += '<div class="kennzahl" style="margin-top:8px"><span>Betroffene Tätigkeiten heute</span>'
          + '<b class="zahl">'+zahl(r.basis,2)+' h/Woche</b></div>'
          + '<div class="kennzahl"><span>Geschätzte Ersparnis '+zahl(w.ersparnis,0)+' %</span>'
          + '<b class="zahl">'+zahl(r.spart,2)+' h/Woche</b></div>'
          + '<div class="kennzahl"><span>Wert bei '+zahl(satz,0)+' €/h</span>'
          + '<b class="zahl">'+zahl(r.wert,0)+' €/Woche · '+zahl(r.jahr,0)+' €/Jahr</b></div>';
        if(r.wochen!==null){
          const gut = r.wochen<=52;
          h += '<div class="kennzahl"><span>Bezahlt sich nach</span>'
            + '<b class="zahl stand" data-s="'+(gut?"gruen":"gelb")+'">'
            + zahl(r.wochen,0)+' Wochen · '+zahl(r.wochen/4.33,1)+' Monaten</b></div>';
        }
        h += '<p class="hinweis" style="margin:8px 0 0">Grundlage: '
          + esc(r.ids.map(i=>{const t=taet(i);return t?t.name:"?";}).join(", "))
          + ', gemessen über die letzten zwölf Wochen.</p>';
      }else{
        h += '<p class="hinweis" style="margin:8px 0 0">Keine Tätigkeiten zugeordnet – ohne die lässt sich nicht rechnen.</p>';
      }
      if(fuehrung){
        h += '<div style="margin-top:10px">'
          + (st!=="beschlossen"? '<button class="knopf zweit klein" data-wunsch-status="beschlossen" data-wunsch-id="'+esc(w.id)+'">beschließen</button> ':'')
          + (st!=="umgesetzt"?   '<button class="knopf zweit klein" data-wunsch-status="umgesetzt" data-wunsch-id="'+esc(w.id)+'">umgesetzt</button> ':'')
          + (st!=="abgelehnt"?   '<button class="knopf zweit klein" data-wunsch-status="abgelehnt" data-wunsch-id="'+esc(w.id)+'">zurückstellen</button>':'')
          + '</div>';
      }
      h += '</div>';
    });
  });
  if(leer) h += '<p class="leer">Noch keine Vorschläge.</p>';
  return h;
}

/* ---------- Auswertung ---------- */
function viewAuswertung(){
  const z = alleZeiten();
  if(!z.length) return '<h2>Auswertung</h2><p class="leer">Noch keine Buchungen vorhanden.</p>';

  const ges = summe(z);
  let wert=0, verr=0; const proTaet={};
  z.forEach(x=>{
    const t=taet(x.taetigkeit_id), st=Number(x.stunden||0);
    if(t&&t.wertschoepfend) wert+=st;
    if(t&&t.verrechenbar) verr+=st;
    const n=t?t.name:"ohne Zuordnung";
    proTaet[n]=proTaet[n]||{h:0, art:tatArt(t)};
    proTaet[n].h+=st;
  });

  let h = '<h2>Wo geht die Zeit hin?</h2>'
    + '<p class="hinweis">Alle Buchungen des letzten Jahres, gegliedert nach Tätigkeit und Auftrag – nicht nach Personen.</p>'
    + '<div class="karte">'
    + '<div class="kennzahl"><span>Zugeordnete Stunden</span><b class="zahl">'+zahl(ges,1)+' h</b></div>'
    + '<div class="kennzahl"><span>Davon am Werkstück</span><b class="zahl">'+zahl(wert,1)+' h · '+zahl(ges?wert/ges*100:0,0)+' %</b></div>'
    + '<div class="kennzahl"><span>Davon berechenbar</span><b class="zahl">'+zahl(verr,1)+' h · '+zahl(ges?verr/ges*100:0,0)+' %</b></div>'
    + '<div class="kennzahl"><span>Weder noch</span><b class="zahl">'+zahl(ges-verr,1)+' h · '+zahl(ges?(ges-verr)/ges*100:0,0)+' %</b></div></div>';

  h += '<h2 class="abstand">Nach Tätigkeit</h2><div class="karte">';
  Object.keys(proTaet).sort((a,b)=>proTaet[b].h-proTaet[a].h).forEach(n=>{
    const p=proTaet[n], anteil=ges?p.h/ges*100:0;
    h += '<div style="padding:9px 0"><div class="kennzahl" style="border:0;padding:0">'
      + '<span>'+esc(n)+'</span><b class="zahl">'+zahl(p.h,1)+' h · '+zahl(anteil,0)+' %</b></div>'
      + '<div class="balken"><i class="'+p.art+'" style="width:'+anteil.toFixed(1)+'%"></i></div></div>';
  });
  h += '</div>';

  // unvollständige Tage
  const luecken=[];
  for(let i=1;i<=14;i++){
    const d=verschieben(heute(),-i);
    const wt=new Date(d+"T12:00:00").getDay(); if(wt===0||wt===6) continue;
    S.mitarbeiter.forEach(m=>{
      const zug=summe(zeitenVon(m.id,d)), anw=anwesend(m.id,d);
      if(anw===null && zug===0) return;
      if(anw===null) luecken.push({d, name:m.name, text:"Anwesenheit fehlt"});
      else if(anw-zug>=0.25) luecken.push({d, name:m.name, text:zahl(anw-zug,2)+" h nicht zugeordnet"});
      else if(zug-anw>=0.25) luecken.push({d, name:m.name, text:zahl(zug-anw,2)+" h zuviel"});
    });
  }
  h += '<h2 class="abstand">Unvollständige Tage</h2>';
  h += luecken.length
    ? '<div class="karte">'+luecken.slice(0,25).map(l=>'<div class="kennzahl"><span>'+esc(l.name)+' · '+datumKurz(l.d)+'</span><b>'+esc(l.text)+'</b></div>').join("")+'</div>'
    : '<p class="leer">Die letzten zwei Wochen sind vollständig.</p>';

  // Nachträge
  const nach = z.filter(x=>x.nachtrag);
  if(nach.length){
    const proA={};
    nach.forEach(x=>{ const a=auftrag(x.auftrag_id); const k=a?a.nummer+" · "+(a.bezeichnung||a.kunde||""):"ohne Auftrag";
      proA[k]=proA[k]||{h:0,n:0}; proA[k].h+=Number(x.stunden||0); proA[k].n++; });
    h += '<h2 class="abstand">Nachträge prüfen</h2><div class="karte">'
      + Object.keys(proA).map(k=>'<div class="kennzahl"><span>'+esc(k)+'</span><b class="zahl">'+zahl(proA[k].h,1)+' h</b></div>').join("")
      + '</div>';
  }

  // Soll gegen Ist
  h += '<h2 class="abstand">Kalkulation gegen Wirklichkeit</h2><div class="karte">';
  const mitSoll = S.auftraege.filter(a=>Number(a.kalkulierte_stunden)>0);
  if(!mitSoll.length){ h += '<p class="leer">Für keinen Auftrag sind kalkulierte Stunden hinterlegt.</p>'; }
  else mitSoll.forEach(a=>{
    const ist=istStunden(a.id), soll=Number(a.kalkulierte_stunden), abw=ist-soll, st=stand(ist,soll);
    h += '<div style="padding:10px 0;border-bottom:1px solid var(--linie)">'
      + '<div class="kennzahl" style="border:0;padding:0"><span>'+esc(a.nummer)+' · '+esc(a.bezeichnung||a.kunde||"")+'</span>'
      + '<b class="zahl stand" data-s="'+st.s+'">'+(abw>0?"+":"")+zahl(abw,1)+' h</b></div>'
      + '<div class="skalatext"><span class="zahl">Soll '+zahl(soll,1)+' h</span><span class="zahl">Ist '+zahl(ist,1)+' h</span></div></div>';
  });
  h += '</div>';

  // Deckungsbeitrag
  const mitGeld = S.auftraege.filter(a=>a.angebotssumme!=null && istStunden(a.id)>0);
  if(mitGeld.length){
    h += '<h2 class="abstand">Deckungsbeitrag je gebuchter Stunde</h2>'
      + '<p class="hinweis">Angebotssumme abzüglich Material, geteilt durch die gebuchten Stunden. Der Wert muss über eurem Stundenverrechnungssatz liegen.</p><div class="karte">';
    mitGeld.slice().sort((a,b)=>{
      const da=(Number(a.angebotssumme)-Number(a.materialkosten||0))/istStunden(a.id);
      const db=(Number(b.angebotssumme)-Number(b.materialkosten||0))/istStunden(b.id);
      return da-db;
    }).forEach(a=>{
      const db=(Number(a.angebotssumme)-Number(a.materialkosten||0))/istStunden(a.id);
      h += '<div class="kennzahl"><span>'+esc(a.nummer)+' · '+esc(a.art||a.bezeichnung||"")+'</span>'
        + '<b class="zahl">'+zahl(db,2)+' €/h</b></div>';
    });
    h += '</div>';
  }

  // nach Auftragsart
  const proArt={};
  S.auftraege.forEach(a=>{
    const ist=istStunden(a.id); if(!ist) return;
    const k=a.art||"ohne Angabe";
    proArt[k]=proArt[k]||{h:0,umsatz:0,material:0,n:0};
    proArt[k].h+=ist; proArt[k].n++;
    if(a.angebotssumme!=null){ proArt[k].umsatz+=Number(a.angebotssumme); proArt[k].material+=Number(a.materialkosten||0); }
  });
  if(Object.keys(proArt).length){
    h += '<h2 class="abstand">Nach Auftragsart</h2><div class="karte">'
      + Object.keys(proArt).sort((a,b)=>proArt[b].h-proArt[a].h).map(k=>{
          const p=proArt[k], db=p.umsatz? (p.umsatz-p.material)/p.h : null;
          return '<div class="kennzahl"><span>'+esc(k)+' ('+p.n+')</span><b class="zahl">'
            + zahl(p.h,1)+' h'+(db!==null? ' · '+zahl(db,0)+' €/h':'')+'</b></div>';
        }).join("")+'</div>';
  }
  return h;
}

/* =====================================================================
   6. Ereignisse
   ===================================================================== */
document.addEventListener("click", async (ev) => {
  const t = ev.target;
  const ist = (id) => t.closest("#"+id);

  const navBtn = t.closest("#nav button");
  if(navBtn){ S.ansicht=navBtn.dataset.ansicht; S.form=null; S.aform=null; S.wform=null; S.vform=null; zeichnen(); return; }

  /* --- Einrichtung --- */
  if(ist("setup_speichern")){
    const url=basisUrl(el("f_url").value), key=el("f_key").value.trim();
    if(!/^https?:\/\/.+/.test(url)) return melden("Bitte die vollständige Projekt-URL eintragen");
    if(key.length<20) return melden("Der Key sieht unvollständig aus");
    if(/^ey/.test(url) || key.indexOf("supabase.co")>=0) return melden("URL und Key sind vertauscht");
    S.cfg={url,key}; sichern("cfg",S.cfg);
    await datenHolen();
    if(!S.online){ S.cfg=null; sichern("cfg",null); return melden("Verbindung fehlgeschlagen – Daten prüfen"); }
    melden("Verbunden"); zeichnen(); return;
  }
  if(ist("verbindung_neu")){
    if(!confirm("Verbindung zurücksetzen? Nicht übertragene Einträge bleiben erhalten.")) return;
    S.cfg=null; S.ich=null; sichern("cfg",null); sichern("ich",null); zeichnen(); return;
  }
  const pb = t.closest("[data-person]");
  if(pb){
    const m = person(pb.dataset.person); if(!m) return;
    const eingabe = prompt("PIN für "+m.name);
    if(eingabe===null) return;
    const pin = eingabe.trim();
    if(!pin) return melden("Ohne PIN geht es nicht");

    let ok = false;
    try{
      const treffer = await sb("mitarbeiter?select=id&id=eq."+encodeURIComponent(m.id)
                              +"&pin=eq."+encodeURIComponent(pin));
      ok = !!(treffer && treffer.length);
      if(ok){ const h = await pruefsumme(m.id, pin); if(h){ S.pinMerk[m.id]=h; sichern("pinMerk", S.pinMerk); } }
    }catch(e){
      const h = await pruefsumme(m.id, pin);
      if(!h || !S.pinMerk[m.id]) return melden("Die erste Anmeldung braucht Netz");
      ok = (S.pinMerk[m.id] === h);
    }
    if(!ok) return melden("PIN stimmt nicht");

    S.ich={id:m.id,name:m.name,rolle:m.rolle}; sichern("ich",S.ich);
    S.ansicht="tag"; S.tag=heute(); zeichnen(); return;
  }

  /* --- Tageswechsel --- */
  const tb = t.closest("[data-tag]");
  if(tb){ S.tag=verschieben(S.tag, Number(tb.dataset.tag)); zeichnen(); return; }
  const gz = t.closest("[data-gehezu]");
  if(gz){ S.tag=gz.dataset.gehezu; S.ansicht="tag"; zeichnen(); return; }

  /* --- Anwesenheit --- */
  const ab = t.closest("[data-anw]");
  if(ab){
    const f=el("anw");
    const neu = Math.min(24, Math.max(0, viertel((komma(f.value)||0) + Number(ab.dataset.anw))));
    f.value = zahl(neu,2);
    await anwesenheitSpeichern(neu);
    return;
  }

  /* --- Stundenregler --- */
  const sb2 = t.closest("[data-std]");
  if(sb2){
    const f=el("f_stunden");
    f.value = zahl(Math.min(24, Math.max(0.25, viertel((komma(f.value)||0) + Number(sb2.dataset.std)))),2);
    return;
  }

  /* --- Formular öffnen --- */
  if(ist("neue_zeit")){
    const anw = anwesend(S.ich.id, S.tag);
    const schon = summe(zeitenVon(S.ich.id, S.tag));
    const rest = anw!==null ? viertel(anw-schon) : 0;
    S.form={id:null, auftrag_id:S.letzte.auftrag_id||"", position_id:S.letzte.position_id||null,
            taetigkeit_id:S.letzte.taetigkeit_id||null,
            stunden: rest>0 ? rest : 1, notiz:"", nachtrag:false, foto:null, mehr:false, mit:[]};
    zeichnen(); return;
  }
  const rb = t.closest("[data-rest]");
  if(rb){ el("f_stunden").value = zahl(Number(rb.dataset.rest),2); return; }
  if(ist("f_mehr")){
    S.form.stunden = viertel(komma(el("f_stunden").value))||S.form.stunden;
    S.form.auftrag_id = el("f_auftrag").value;
    S.form.position_id = el("f_position") ? (el("f_position").value||null) : S.form.position_id;
    S.form.mehr = !S.form.mehr;
    zeichnen(); return;
  }
  const be = t.closest("[data-bearbeiten]");
  if(be){
    const z = alleZeiten().find(x=>x.id===be.dataset.bearbeiten); if(!z) return;
    S.form={id:z.id, auftrag_id:z.auftrag_id||"", position_id:z.position_id||null, taetigkeit_id:z.taetigkeit_id,
            stunden:Number(z.stunden), notiz:z.notiz||"", nachtrag:!!z.nachtrag, foto:null,
            mehr: !!(z.notiz || z.nachtrag), mit:[]};
    zeichnen(); return;
  }
  if(ist("f_abbrechen")){ S.form=null; zeichnen(); return; }

  const tt = t.closest("[data-taetigkeit]");
  if(tt){
    Array.from(document.querySelectorAll("[data-taetigkeit]")).forEach(x=>x.classList.remove("aktiv"));
    tt.classList.add("aktiv");
    if(S.form) S.form.taetigkeit_id = tt.dataset.taetigkeit;
    return;
  }

  /* --- Vorläufiger Auftrag --- */
  if(ist("vorlaeufig")){
    S.form.stunden = viertel(komma(el("f_stunden").value))||S.form.stunden;
    S.form.auftrag_id = el("f_auftrag").value;
    if(el("f_notiz")) S.form.notiz = el("f_notiz").value;

    zeichnen(); return;
  }
  if(ist("v_zurueck")){ S.vform=null; zeichnen(); return; }
  if(ist("v_anlegen")){
    const kunde = el("v_kunde2").value.trim();
    const bez   = el("v_bez2").value.trim();
    const posn  = el("v_pos2").value.trim();
    if(!kunde && !bez) return melden("Kunde oder Auftrag muss ausgefüllt sein");
    const stamm = "VL-"+heute().replace(/-/g,"").slice(2);
    const nr = stamm+"-"+String(S.auftraege.filter(a=>String(a.nummer).indexOf(stamm)===0).length+1).padStart(2,"0");
    try{
      const neu = await sb("auftraege", {method:"POST", prefer:"return=representation", body:{
        nummer:nr, kunde:kunde||null, bezeichnung:bez||"Vorläufiger Auftrag",
        art:"Kundendienst", kalkulierte_stunden:0, nachpflegen:true}});
      const aid = neu && neu[0] && neu[0].id;
      let pid = null;
      if(aid && posn){
        const np = await sb("positionen", {method:"POST", prefer:"return=representation", body:{
          auftrag_id:aid, bezeichnung:posn, kalkulierte_stunden:0, sortierung:100}});
        pid = np && np[0] && np[0].id;
      }
      await datenHolen();
      S.form.auftrag_id = aid||""; S.form.position_id = pid;
      S.vform = null;
      melden("Angelegt als "+nr); zeichnen();
    }catch(e){ melden("Geht nur online: "+e.message); }
    return;
  }
  if(ist("pos_neu")){
    const aid = el("f_auftrag").value;
    if(!aid) return melden("Erst einen Auftrag wählen");
    const name = prompt("Bezeichnung der Position");
    if(!name || !name.trim()) return;
    S.form.stunden = viertel(komma(el("f_stunden").value))||S.form.stunden;
    S.form.auftrag_id = aid;
    try{
      const np = await sb("positionen", {method:"POST", prefer:"return=representation", body:{
        auftrag_id:aid, bezeichnung:name.trim(), kalkulierte_stunden:0,
        sortierung:100+posten(aid).length}});
      await datenHolen();
      S.form.position_id = (np && np[0] && np[0].id) || null;
      melden("Position angelegt"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }

  /* --- Uhr --- */
  if(ist("uhr_start")){
    if(!S.form || !S.form.taetigkeit_id) return melden("Erst die Tätigkeit auswählen");
    S.uhr={start:Date.now(), taetigkeit_id:S.form.taetigkeit_id,
           auftrag_id:(el("f_auftrag")? el("f_auftrag").value : "")||null,
           position_id:(el("f_position")? el("f_position").value : "")||null};
    sichern("uhr",S.uhr); S.form=null; S.tag=heute(); zeichnen(); return;
  }
  if(ist("uhr_stopp")){
    const std = viertel((Date.now()-S.uhr.start)/3600000);
    const u = S.uhr; S.uhr=null; sichern("uhr",null);
    if(std<0.25){ melden("Unter einer Viertelstunde – nicht gebucht"); zeichnen(); return; }
    await zeitBuchen([{auftrag_id:u.auftrag_id, position_id:u.position_id||null,
      taetigkeit_id:u.taetigkeit_id, mitarbeiter_id:S.ich.id,
      datum:heute(), stunden:std, notiz:null, nachtrag:false, foto:null}]);
    return;
  }

  /* --- Buchung speichern --- */
  if(ist("f_speichern")){
    const f=S.form;
    if(!f.taetigkeit_id) return melden("Bitte die Tätigkeit auswählen");
    const tk = taet(f.taetigkeit_id);
    const aid = el("f_auftrag").value || null;
    if(tk && tk.auftrag_noetig && !aid) return melden("Für diese Tätigkeit fehlt der Auftrag");
    const std = viertel(komma(el("f_stunden").value));
    if(!(std>0) || std>24) return melden("Stunden zwischen 0,25 und 24 eintragen");
    const pid = el("f_position") ? (el("f_position").value||null) : null;
    const daten = {auftrag_id:aid, position_id:pid, taetigkeit_id:f.taetigkeit_id, datum:S.tag, stunden:std,
      notiz: el("f_notiz") ? (el("f_notiz").value.trim()||null) : (f.notiz||null),
      nachtrag: el("f_nachtrag") ? el("f_nachtrag").checked : !!f.nachtrag,
      foto: f.foto||null};
    S.letzte = {auftrag_id:aid||"", position_id:pid, taetigkeit_id:f.taetigkeit_id}; sichern("letzte", S.letzte);

    if(f.id){
      try{
        await sb("zeiten?id=eq."+encodeURIComponent(f.id), {method:"PATCH", body:daten, prefer:"return=minimal"});
        await datenHolen(); melden("Geändert");
      }catch(e){ melden("Änderung geht nur online"); }
      S.form=null; zeichnen(); return;
    }
    const wer = [S.ich.id].concat(Array.from(document.querySelectorAll(".mit:checked")).map(x=>x.value));
    await zeitBuchen(wer.map(mid=>Object.assign({}, daten, {mitarbeiter_id:mid})));
    return;
  }
  if(ist("f_loeschen")){
    if(!confirm("Buchung löschen?")) return;
    try{
      await sb("zeiten?id=eq."+encodeURIComponent(S.form.id), {method:"DELETE"});
      await datenHolen(); melden("Gelöscht");
    }catch(e){ melden("Löschen geht nur online"); }
    S.form=null; zeichnen(); return;
  }

  /* --- Auftragsformular --- */
  if(ist("auftrag_neu")){
    S.aform={id:null, art:"Treppe"}; S.ansicht="auftraege"; zeichnen(); return;
  }
  const ae = t.closest("[data-auftrag-bearbeiten]");
  if(ae){ S.aform=Object.assign({}, auftrag(ae.dataset.auftragBearbeiten)); zeichnen(); return; }
  if(ist("a_abbrechen")){ S.aform=null; zeichnen(); return; }
  if(ist("p_hinzu")){
    const bez = el("p_bez").value.trim();
    if(!bez) return melden("Bezeichnung des Postens fehlt");
    const std = el("p_std").value.trim()!=="" ? komma(el("p_std").value) : 0;
    try{
      await sb("positionen", {method:"POST", prefer:"return=minimal", body:{
        auftrag_id:S.aform.id, bezeichnung:bez, kalkulierte_stunden:std,
        angebotssumme:  el("p_ang").value.trim()!=="" ? komma(el("p_ang").value) : null,
        materialkosten: el("p_mat").value.trim()!=="" ? komma(el("p_mat").value) : null,
        sortierung: 100 + posten(S.aform.id).length}});
      await datenHolen(); melden("Posten angelegt"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  const pl = t.closest("[data-posten-loeschen]");
  if(pl){
    if(!confirm("Posten löschen? Gebuchte Stunden bleiben am Auftrag erhalten.")) return;
    try{
      await sb("positionen?id=eq."+encodeURIComponent(pl.dataset.postenLoeschen), {method:"DELETE"});
      await datenHolen(); melden("Gelöscht"); zeichnen();
    }catch(e){ melden("Löschen geht nur online"); }
    return;
  }

  if(ist("a_speichern") || ist("a_abschliessen") || ist("a_oeffnen")){
    const f=S.aform;
    const nummer = el("a_nummer").value.trim();
    if(!nummer) return melden("Die Auftragsnummer fehlt");
    const daten = {
      nummer, art: el("a_art").value,
      kunde: el("a_kunde").value.trim()||null,
      bezeichnung: el("a_bez").value.trim()||null,
      kalkulierte_stunden: komma(el("a_std").value)||0, nachpflegen: false,
      angebotssumme: el("a_summe").value!=="" ? komma(el("a_summe").value) : null,
      materialkosten: el("a_mat").value!=="" ? komma(el("a_mat").value) : null
    };
    if(f.id){
      daten.abschluss_notiz = el("a_notiz") ? (el("a_notiz").value.trim()||null) : null;
      if(ist("a_abschliessen")){ daten.status="abgeschlossen"; daten.abgeschlossen_am=heute(); }
      if(ist("a_oeffnen")){ daten.status="offen"; daten.abgeschlossen_am=null; }
    }
    try{
      if(f.id) await sb("auftraege?id=eq."+encodeURIComponent(f.id), {method:"PATCH", body:daten, prefer:"return=minimal"});
      else     await sb("auftraege", {method:"POST", body:daten, prefer:"return=minimal"});
      await datenHolen(); S.aform=null; S.ansicht="auftraege"; melden("Gespeichert"); zeichnen();
    }catch(e){ melden("Geht nur online: "+e.message); }
    return;
  }

  /* --- Verwaltung --- */
  if(ist("rueck_schalter")){
    const neu = S.einst.rueckmeldung==="1" ? "0" : "1";
    try{
      await sb("einstellungen?on_conflict=schluessel", {method:"POST",
        body:{schluessel:"rueckmeldung", wert:neu}, prefer:"resolution=merge-duplicates,return=minimal"});
      S.einst.rueckmeldung=neu; melden(neu==="1"?"Rückmeldung eingeschaltet":"Rückmeldung ausgeschaltet"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  if(ist("v_person_speichern")){
    const name=el("v_name").value.trim(); if(!name) return melden("Name fehlt");
    const rolle=el("v_rolle").value, pin=el("v_pin").value.trim();
    if(pin.length<4) return melden("Bitte eine PIN mit mindestens vier Stellen");
    try{
      await sb("mitarbeiter",{method:"POST", body:{name,rolle,pin:pin,
        wochensoll: komma(el("v_soll").value)||38.5, arbeitstage:5, startsaldo:0}, prefer:"return=minimal"});
      await datenHolen(); melden("Person angelegt"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  if(ist("v_taet_speichern")){
    const name=el("v_tname").value.trim(); if(!name) return melden("Bezeichnung fehlt");
    try{
      const wert = el("v_twert").checked, verr = el("v_tverr").checked;
      const art  = wert ? "wert" : (verr ? "noetig" : "verlust");
      // in den passenden Farbblock einsortieren statt ans Ende hängen
      const gleiche = S.taetigkeiten.filter(x=>tatArt(x)===art).map(x=>Number(x.sortierung)||0);
      const sortierung = gleiche.length ? Math.max.apply(null, gleiche)+1 : 200;
      await sb("taetigkeiten",{method:"POST", body:{name, wertschoepfend:wert,
        verrechenbar:verr, auftrag_noetig:true, sortierung}, prefer:"return=minimal"});
      await datenHolen(); melden("Tätigkeit angelegt"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  if(ist("k_speichern")){
    const mid = el("k_person").value;
    const daten = {};
    if(el("k_soll").value.trim()!=="")  daten.wochensoll  = komma(el("k_soll").value);
    if(el("k_tage").value.trim()!=="")  daten.arbeitstage = komma(el("k_tage").value);
    if(el("k_start").value.trim()!=="") daten.startsaldo  = komma(el("k_start").value);
    if(!Object.keys(daten).length) return melden("Nichts einzutragen");
    if(daten.wochensoll!==undefined && !(daten.wochensoll>0 && daten.wochensoll<=80)) return melden("Wochensoll zwischen 0 und 80");
    if(daten.arbeitstage!==undefined && !(daten.arbeitstage>0 && daten.arbeitstage<=7)) return melden("Arbeitstage zwischen 1 und 7");
    try{
      await sb("mitarbeiter?id=eq."+encodeURIComponent(mid), {method:"PATCH", body:daten, prefer:"return=minimal"});
      await datenHolen(); melden("Stundenkonto angepasst"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  if(ist("p_speichern")){
    const mid = el("p_person").value, pin = el("p_pin").value.trim();
    if(pin.length<4) return melden("Bitte eine PIN mit mindestens vier Stellen");
    try{
      await sb("mitarbeiter?id=eq."+encodeURIComponent(mid), {method:"PATCH", body:{pin}, prefer:"return=minimal"});
      delete S.pinMerk[mid]; sichern("pinMerk", S.pinMerk);
      el("p_pin").value=""; melden("PIN gesetzt");
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  if(ist("v_satz_speichern")){
    const v = komma(el("v_satz").value), k = komma(el("v_kosten").value);
    if(!(v>0)) return melden("Bitte einen Verrechnungssatz eintragen");
    if(!(k>0)) return melden("Bitte einen Kostensatz eintragen");
    if(k>v) return melden("Der Kostensatz sollte unter dem Verrechnungssatz liegen");
    try{
      await sb("einstellungen?on_conflict=schluessel", {method:"POST",
        body:[{schluessel:"stundensatz", wert:String(v)},{schluessel:"kostensatz", wert:String(k)}],
        prefer:"resolution=merge-duplicates,return=minimal"});
      S.einst.stundensatz=String(v); S.einst.kostensatz=String(k); melden("Gespeichert"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  /* --- Reiter Bedarf --- */
  const rt = t.closest("[data-reiter]");
  if(rt){ S.reiter=rt.dataset.reiter; S.wform=null; zeichnen(); return; }

  /* --- Wünsche --- */
  if(ist("w_neu")){
    S.wform={id:null, titel:"", begruendung:"", kosten:null, taetigkeit_ids:"", ersparnis:30};
    zeichnen(); return;
  }
  if(ist("w_abbrechen")){ S.wform=null; zeichnen(); return; }
  if(ist("w_speichern")){
    const titel = el("w_titel").value.trim();
    if(!titel) return melden("Bitte eintragen, was du dir wünschst");
    const ids = Array.from(document.querySelectorAll(".wtaet:checked")).map(x=>x.value);
    const proz = komma(el("w_proz").value);
    if(ids.length && !(proz>0 && proz<=100)) return melden("Ersparnis zwischen 1 und 100 Prozent");
    const b = {titel, begruendung: el("w_grund").value.trim()||null,
      kosten: el("w_kosten").value.trim()!=="" ? komma(el("w_kosten").value) : null,
      taetigkeit_ids: ids.join(","), ersparnis: ids.length? proz : null,
      status:"idee", mitarbeiter_id:S.ich.id};
    try{
      await sb("wuensche", {method:"POST", body:b, prefer:"return=minimal"});
      await datenHolen(); S.wform=null; melden("Eingetragen"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  const ws = t.closest("[data-wunsch-status]");
  if(ws){
    try{
      await sb("wuensche?id=eq."+encodeURIComponent(ws.dataset.wunschId),
        {method:"PATCH", body:{status:ws.dataset.wunschStatus}, prefer:"return=minimal"});
      await datenHolen(); melden("Übernommen"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }

  /* --- Lager --- */
  if(ist("l_speichern")){
    const txt = el("l_text").value.trim();
    if(!txt) return melden("Bitte eintragen, was fehlt");
    const b = {client_id:uid(), text:txt, foto:S.lagerFoto||null,
               mitarbeiter_id:S.ich.id, status:"offen", angelegt_am:new Date().toISOString()};
    const ok = await senden("lager", b, "return=minimal,resolution=ignore-duplicates", "lager");
    S.lagerFoto=null;
    if(ok){ await datenHolen(); melden("Eingetragen"); }
    else melden("Offline gespeichert – wird später übertragen");
    zeichnen(); return;
  }
  const ls = t.closest("[data-lager-status]");
  if(ls){
    try{
      await sb("lager?id=eq."+encodeURIComponent(ls.dataset.lagerId), {method:"PATCH",
        body:{status:ls.dataset.lagerStatus, geaendert_am:new Date().toISOString()}, prefer:"return=minimal"});
      await datenHolen(); melden(ls.dataset.lagerStatus==="bestellt"?"Als bestellt vermerkt":"Erledigt"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  const ll = t.closest("[data-lager-loeschen]");
  if(ll){
    if(!confirm("Eintrag löschen?")) return;
    try{
      await sb("lager?id=eq."+encodeURIComponent(ll.dataset.lagerLoeschen), {method:"DELETE"});
      await datenHolen(); melden("Gelöscht"); zeichnen();
    }catch(e){ melden("Löschen geht nur online"); }
    return;
  }

  if(ist("neu_laden")){ await queueSenden(); await datenHolen(); melden(S.online?"Aktualisiert":"Offline"); zeichnen(); return; }
  if(ist("csv")){ csvExport(); return; }
});

/* --- Eingabefelder --- */
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if(t.id==="anw"){
    const v = viertel(komma(t.value));
    if(!(v>=0) || v>24){ t.value=""; return melden("Bitte einen Wert zwischen 0 und 24 eintragen"); }
    t.value=zahl(v,2); await anwesenheitSpeichern(v); return;
  }
  if(t.id==="a_art" && S.aform && !S.aform.id){ S.aform.art=t.value; zeichnen(); return; }
  if(t.classList && t.classList.contains("pfeld")){
    const pid=t.dataset.pid, feld=t.dataset.feld;
    const roh=t.value.trim();
    const wert = roh==="" ? (feld==="kalkulierte_stunden" ? 0 : null) : komma(roh);
    if(roh!=="" && !(wert>=0)) return melden("Bitte eine Zahl eintragen");
    const daten={}; daten[feld]=wert;
    try{
      await sb("positionen?id=eq."+encodeURIComponent(pid), {method:"PATCH", body:daten, prefer:"return=minimal"});
      const x=pos(pid); if(x) x[feld]=wert;
      melden("Gespeichert"); zeichnen();
    }catch(e){ melden("Geht nur online"); }
    return;
  }
  if(t.id==="f_auftrag" && S.form){
    S.form.stunden = viertel(komma(el("f_stunden").value))||S.form.stunden;
    S.form.auftrag_id = t.value;
    S.form.position_id = null;
    if(el("f_notiz")) S.form.notiz = el("f_notiz").value;
    zeichnen(); return;
  }
  if(t.id==="l_foto"){
    const datei = t.files && t.files[0]; if(!datei) return;
    try{
      S.lagerFoto = await bildVerkleinern(datei);
      el("l_vorschau").innerHTML = '<img class="vorschau" src="'+S.lagerFoto+'" alt="Foto">';
    }catch(e){ melden("Bild konnte nicht verarbeitet werden"); }
    return;
  }
  if(t.id==="f_foto"){
    const datei = t.files && t.files[0]; if(!datei) return;
    try{
      S.form.foto = await bildVerkleinern(datei);
      el("f_vorschau").innerHTML = '<img class="vorschau" src="'+S.form.foto+'" alt="Angehängtes Foto">';
    }catch(e){ melden("Bild konnte nicht verarbeitet werden"); }
    return;
  }
});

/* =====================================================================
   7. Speichervorgänge
   ===================================================================== */
async function zeitBuchen(liste){
  let offline=0;
  for(const b of liste){
    b.client_id = uid();
    const ok = await senden("zeiten", b, "return=minimal,resolution=ignore-duplicates", "zeit");
    if(!ok) offline++;
  }
  if(offline) melden("Offline gespeichert – wird später übertragen");
  else { await datenHolen(); melden(liste.length>1 ? liste.length+" Buchungen gespeichert" : "Gebucht"); }
  S.form=null; zeichnen();
}

async function anwesenheitSpeichern(std){
  const b = {mitarbeiter_id:S.ich.id, datum:S.tag, stunden:std};
  const ok = await senden("anwesenheit?on_conflict=mitarbeiter_id,datum", b,
                          "resolution=merge-duplicates,return=minimal", "anw");
  if(ok){
    const r = S.anwesenheit.find(x=>x.mitarbeiter_id===S.ich.id && x.datum===S.tag);
    if(r) r.stunden=std; else S.anwesenheit.push(Object.assign({},b));
  }
  zeichnen();
}

/* ---------- Bild verkleinern ---------- */
function bildVerkleinern(datei){
  return new Promise((ok,fehler)=>{
    const leser=new FileReader();
    leser.onerror=()=>fehler(new Error("Lesefehler"));
    leser.onload=()=>{
      const bild=new Image();
      bild.onerror=()=>fehler(new Error("Kein Bild"));
      bild.onload=()=>{
        const max=1000;
        const f=Math.min(1, max/Math.max(bild.width,bild.height));
        const c=document.createElement("canvas");
        c.width=Math.round(bild.width*f); c.height=Math.round(bild.height*f);
        c.getContext("2d").drawImage(bild,0,0,c.width,c.height);
        ok(c.toDataURL("image/jpeg",0.6));
      };
      bild.src=leser.result;
    };
    leser.readAsDataURL(datei);
  });
}

/* ---------- laufende Uhr ---------- */
let uhrInterval=null;
function uhrTicken(){
  clearInterval(uhrInterval);
  const anzeigen=()=>{
    const f=el("uhrzeit"); if(!f||!S.uhr){ clearInterval(uhrInterval); return; }
    const s=Math.floor((Date.now()-S.uhr.start)/1000);
    f.textContent = String(Math.floor(s/3600)).padStart(2,"0")+":"
      + String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  };
  anzeigen(); uhrInterval=setInterval(anzeigen,1000);
}

/* ---------- CSV ---------- */
function csvExport(){
  const kopf=["Datum","Mitarbeiter","Auftragsnummer","Kunde","Auftragsart","Taetigkeit",
              "Wertschoepfend","Verrechenbar","Stunden","Nachtrag","Notiz"];
  const zeilen = alleZeiten().slice().sort((a,b)=>String(a.datum).localeCompare(String(b.datum))).map(z=>{
    const m=person(z.mitarbeiter_id), a=auftrag(z.auftrag_id), t=taet(z.taetigkeit_id);
    return [z.datum, m?m.name:"", a?a.nummer:"", a?(a.kunde||""):"", a?(a.art||""):"",
            t?t.name:"", t?(t.wertschoepfend?"ja":"nein"):"", t?(t.verrechenbar?"ja":"nein"):"",
            String(z.stunden).replace(".",","), z.nachtrag?"ja":"nein", z.notiz||""];
  });
  const csv=[kopf].concat(zeilen).map(r=>r.map(f=>'"'+String(f==null?"":f).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="stunden_"+heute()+".csv";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

/* =====================================================================
   8. Start
   ===================================================================== */
window.addEventListener("online", async ()=>{ await queueSenden(); await datenHolen(); zeichnen(); });
window.addEventListener("offline", ()=>{ S.online=false; melden("Offline – Einträge werden zwischengespeichert"); });

(async function start(){
  if(S.cfg){ await queueSenden(); await datenHolen(); }
  if(S.ich && S.mitarbeiter.length && !S.mitarbeiter.some(m=>m.id===S.ich.id)){ S.ich=null; sichern("ich",null); }
  zeichnen();
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
